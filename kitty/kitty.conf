font_family      family=Monocraft style=Light     features=-liga
bold_font        family=Monocraft style=Bold        features=-liga
italic_font      family=Monocraft style=Light-Italic      features=-liga
bold_italic_font family=Monocraft style=Bold-Italic features=-liga

font_size 10.0

shell_integration no-cursor
cursor_shape      block
cursot            none

cursor_trail                 3
cursor_trail_decay           0.1 0.5
cursor_trail_start_threshold 0

allow_remote_control socket-only
allow_remote_control socket
allow_remote_control yes

undercurl_style thin-sparse
modify_font     cell_width          1px
modify_font     cell_height         3px
modify_font     baseline            -1px
modify_font     underline_position  1
modify_font     underline_thickness 100%

map ctrl+equal       change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           restore_font_size
map ctrl+kp_0        restore_font_size

window_padding_width    5
include                 theme.conf
confirm_os_window_close 0
sync_to_monitor         yes
cursor                  none
